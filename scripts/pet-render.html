<!doctype html><style>body{margin:0;background:transparent}canvas{display:block}</style><script type="importmap">{"imports":{"three":"/package/build/three.module.js"}}</script><script type="module">
import * as T from 'three';
import {GLTFLoader} from '/package/examples/jsm/loaders/GLTFLoader.js';
const name=new URLSearchParams(location.search).get('pet'),angle=Number(new URLSearchParams(location.search).get('angle')||0);
const renderer=new T.WebGLRenderer({alpha:true,antialias:true,preserveDrawingBuffer:true});renderer.setSize(768,768);renderer.setPixelRatio(1);renderer.setClearColor(0,0);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;document.body.append(renderer.domElement);
const scene=new T.Scene();scene.add(new T.HemisphereLight(0xfff9eb,0xc5d7e8,2.2));
for(const [position,intensity] of [[[3,4,5],3], [[-3,2,-2],2]]){const light=new T.DirectionalLight(0xffffff,intensity);light.position.set(...position);scene.add(light);}
const gltf=await new GLTFLoader().loadAsync('/pets/'+name+'.glb');const model=gltf.scene;scene.add(model);
const box=new T.Box3().setFromObject(model),center=box.getCenter(new T.Vector3()),size=box.getSize(new T.Vector3());model.position.sub(center);model.scale.setScalar(2.7/Math.max(size.x,size.y,size.z));model.rotation.y=angle;
model.updateMatrixWorld(true);const fitted=new T.Box3().setFromObject(model),fitCenter=fitted.getCenter(new T.Vector3()),fitSize=fitted.getSize(new T.Vector3()),extent=Math.max(Math.hypot(size.x,size.z),size.y)*model.scale.x*.58;const camera=new T.OrthographicCamera(-extent,extent,extent,-extent,.1,100);camera.position.set(fitCenter.x,fitCenter.y,6);camera.lookAt(fitCenter);renderer.render(scene,camera);
window.renderTurn=()=>{
 const strip=document.createElement('canvas');strip.width=320*25;strip.height=320;const ctx=strip.getContext('2d');
 for(let i=0;i<=24;i++){model.rotation.y=angle+i*Math.PI*2/24;renderer.render(scene,camera);ctx.drawImage(renderer.domElement,i*320,0,320,320);}
 model.rotation.y=angle;renderer.render(scene,camera);return strip.toDataURL('image/png');
};window.renderReady=true;
</script>
