<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拍手输入测试 · Let's Clap</title><link rel="stylesheet" href="/style.css"><style>main{max-width:850px;margin:40px auto;padding:24px}.stats{display:flex;gap:32px;flex-wrap:wrap;margin:28px 0}.stats strong{display:block;font-size:32px}meter{width:100%;height:24px}#events{max-height:240px;overflow:auto;font-variant-numeric:tabular-nums}button{margin:6px}label{display:block;margin:20px 0}select{font:inherit;padding:8px}#status{min-height:3em}</style></head><body><main><a href="/">← 回到游戏</a><h1>拍手输入测试</h1><p>声音只在本机处理，不上传、不调用大模型。先安静一秒，再拍手；建议戴耳机，避免扬声器声音进入麦克风。</p><label>灵敏度 <select id="sensitivity"><option value="1">标准</option><option value="1.6">轻拍 / 距离较远</option><option value=".7">较吵环境</option></select></label><button id="start" class="primary">开启麦克风测试</button><button id="stop" disabled>停止麦克风</button><p id="status" role="status">尚未开启麦克风。可先用下方伴奏测试误触发。</p><meter id="level" min="0" max=".3" value="0" aria-label="麦克风音量"></meter><div class="stats"><div><strong id="count">0</strong>检测到的拍手</div><div><strong id="delay">—</strong>处理与消息延迟（ms）</div></div><p>延迟从音频线程收到采样后计算，不包含麦克风设备、系统采集和扬声器延迟；不能当作完整端到端延迟。</p><p id="settings" class="note"></p><h2>音频文件测试</h2><p>记录含拍手的 WAV 后选择文件，可检查漏识别与多识别。文件不会上传。</p><input id="file" type="file" accept="audio/*" aria-label="选择音频文件"><button id="backing">检测大风车无鼓伴奏</button><p id="file-result" role="status"></p><ol id="events" aria-label="识别时间记录"></ol><p class="note">这是声音突发检测：敲桌子、爆破音也可能误触发。准确率需用真实拍手和现场噪声逐项核对。</p></main><script type="module" src="/game/clap-lab.js"></script></body></html>
