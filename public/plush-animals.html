<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Let's Clap · 动物毛绒伙伴 3D</title><style>*{box-sizing:border-box}body{margin:0;background:#fbf7ed;color:#263d39;font-family:"PingFang SC",sans-serif}main{max-width:1100px;margin:auto;padding:40px 24px}a{color:#245c4c}h1{font-size:36px;margin:12px 0}p{line-height:1.7;color:#586c65}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin:32px 0}article{background:#fffdf7;border-radius:30px;overflow:hidden;border:1px solid #e4e7d8}.stage{height:300px;touch-action:none;cursor:grab;background:#edf1e4}.stage:active{cursor:grabbing}canvas{display:block;width:100%;height:100%}.copy{padding:20px 24px}h2{margin:0 0 8px;font-size:22px}.status{font-size:13px}button{font:inherit;padding:10px 14px;border:1px solid #bac9bd;border-radius:14px;background:#fff;color:#245c4c;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #245c4c;outline-offset:4px}.actions{display:flex;align-items:center;gap:16px}small{display:block;color:#586c65;margin-top:24px}@media(max-width:650px){.grid{grid-template-columns:1fr}.stage{height:280px}main{padding:24px 16px}h1{font-size:28px}}</style><main><a href="http://127.0.0.1:5173/">Let's Clap / 小小节奏岛</a><h1>熟悉的小动物，软软胖胖。</h1><p>小鲸鱼、小企鹅、腊肠狗。保留熟悉的动物轮廓，微调配色和表情。拖动看看背面，滚轮放大；每个模型都来自真实 Tripo 生成任务。</p><div class="grid" id="grid"></div><small>GLB 内含短绒贴图；此预览额外叠加细绒渲染，减少颗粒和塑料反光。下载的 GLB 不含预览专用细绒效果。当前为静态模型，未绑定动画。参考图片未上传给 Tripo。</small></main><script type="module">
import * as T from './game/vendor/three.module.js';import {GLTFLoader} from './game/vendor/GLTFLoader.js';
import {addFinePile} from './plush-fur.js';
const items=[['whale','悠悠 · 小鲸鱼','蓝紫背、奶油肚，小鳍和圆圆的尾巴。','assets/plush-v2/'],['penguin','蹦蹦 · 小企鹅','灰白胖肚子，小短翅，暖橘色小嘴。','assets/plush-v2/'],['dachshund','咚咚 · 腊肠狗','肉桂棕长身体，奶油色小脚，软软垂耳。','assets/plush-v2/']];
for(const [id,name,desc,dir] of items){const card=document.createElement('article');card.innerHTML=`<div class="stage" tabindex="0" aria-label="${name}，拖动或方向键旋转3D模型"></div><div class="copy"><h2>${name}</h2><p>${desc}</p><p class="status" role="status">正在加载真实 3D 资产…</p><div class="actions"><button>恢复视角</button><a href="${dir+id}.glb" download>下载 GLB</a></div></div>`;document.querySelector('#grid').append(card);const host=card.querySelector('.stage'),status=card.querySelector('.status');
const scene=new T.Scene();scene.background=new T.Color('#edf1e4');const camera=new T.PerspectiveCamera(35,1,.01,100);const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;host.append(renderer.domElement);scene.add(new T.HemisphereLight('#fff8eb','#879b88',2.6));const sun=new T.DirectionalLight('#fff0da',3);sun.position.set(3,5,4);scene.add(sun);const fill=new T.DirectionalLight('#e6efff',1.5);fill.position.set(-3,2,-3);scene.add(fill);const floor=new T.Mesh(new T.CircleGeometry(1.7,64),new T.MeshStandardMaterial({color:'#dde5cd',roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-1.08;scene.add(floor);const group=new T.Group();scene.add(group);let zoom=4.4;const initialYaw=id==='penguin'?-Math.PI/2:-Math.PI/4;
function draw(){camera.position.set(0,.35,zoom);camera.lookAt(0,0,0);renderer.render(scene,camera)}function resize(){renderer.setSize(host.clientWidth,host.clientHeight);camera.aspect=host.clientWidth/host.clientHeight;camera.updateProjectionMatrix();draw()}new ResizeObserver(resize).observe(host);
host.onkeydown=e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();group.rotation.y+=e.key==='ArrowLeft'?-.15:e.key==='ArrowRight'?.15:0;group.rotation.x=Math.max(-.5,Math.min(.5,group.rotation.x+(e.key==='ArrowUp'?-.1:e.key==='ArrowDown'?.1:0)));draw()}};function load(){status.textContent='正在加载真实 3D 资产…';new GLTFLoader().load(dir+id+'.glb',g=>{addFinePile(g.scene);const b=new T.Box3().setFromObject(g.scene),s=b.getSize(new T.Vector3()),c=b.getCenter(new T.Vector3());g.scene.position.sub(c);const scaled=new T.Group();scaled.add(g.scene);scaled.scale.setScalar(2/Math.max(s.x,s.y,s.z));group.add(scaled);group.rotation.y=initialYaw;status.textContent='Tripo GLB 已加载 · 可旋转查看';host.dataset.loaded=id;draw()},undefined,()=>{status.innerHTML='资产尚未就绪。<button class="retry">重新加载</button>';status.querySelector('button').onclick=load})}load();
let point=null;host.onpointerdown=e=>{point=[e.clientX,e.clientY];host.setPointerCapture(e.pointerId)};host.onpointermove=e=>{if(!point)return;group.rotation.y+=(e.clientX-point[0])*.012;group.rotation.x=Math.max(-.5,Math.min(.5,group.rotation.x+(e.clientY-point[1])*.008));point=[e.clientX,e.clientY];draw()};host.onpointerup=host.onpointercancel=()=>point=null;host.onwheel=e=>{e.preventDefault();zoom=Math.max(2.5,Math.min(7,zoom+e.deltaY*.003));draw()};card.querySelector('.copy button').onclick=()=>{zoom=4.4;group.rotation.set(0,initialYaw,0);draw()};}
</script></html>
